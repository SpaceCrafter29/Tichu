<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tichu - Spielbrett</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { padding: 20px 14px 80px; }
  .scorebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #141414; border-top: 1px solid var(--border); padding: 10px 14px; text-align: center; font-size: 0.95rem; }
  .scorebar b { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 2px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .error-banner { background: #3a1418; border: 1px solid #6b2229; color: #ff9aa2; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; }

  .seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .seat-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .seat-panel.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .seat-panel.me { background: rgba(255, 138, 52, 0.1); }
  .seat-panel .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .seat-panel .name { font-weight: 700; font-size: 0.95rem; }
  .seat-panel .meta { font-size: 0.78rem; color: var(--muted); }
  .flair { display: inline-block; font-size: 0.7rem; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
  .flair.gt { background: #7c3aed33; color: #c4b5fd; }
  .flair.t { background: #d9770633; color: #fdba74; }
  .flair.place { background: #16a34a33; color: #86efac; }
  .seat-tichu-btn { font-size: 0.72rem; padding: 4px 8px; margin-top: 6px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 6px; }

  .cards-row { display: flex; flex-wrap: wrap; gap: 6px; }

  .pcard { width: 52px; height: 74px; border-radius: 7px; background: #f4efe2; border: 1px solid #d9d0ba; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.35); cursor: default; flex-shrink: 0; }
  .pcard.small { width: 40px; height: 56px; }
  .pcard.clickable { cursor: pointer; }
  .pcard.selected { box-shadow: 0 0 0 3px var(--accent), 0 4px 10px rgba(0,0,0,0.4); transform: translateY(-4px); }
  .pcard.assigned { box-shadow: 0 0 0 3px var(--accent); }
  .pcard.special { background: #e8c471; border-color: #b8862f; }
  .pcard .corner { position: absolute; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 12px; line-height: 1; }
  .pcard.small .corner { font-size: 9px; }
  .pcard .corner.tl { top: 4px; left: 5px; }
  .pcard .corner.br { bottom: 4px; right: 5px; transform: rotate(180deg); }
  .pcard .icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  .table-area { background: radial-gradient(closest-side, #2a2a2a, #141414 78%); border-radius: 20px; padding: 24px; margin-bottom: 16px; min-height: 140px; }
  .trick-label { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; text-align: center; }
  .trick-cards { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }

  .hand-zone { margin-bottom: 12px; }
  .hand-zone .label { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }

  .actionbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .actionbar .spacer { flex: 1; }
  .pcard.dim { opacity: .3; filter: grayscale(1); cursor: not-allowed; }
  .wish-chip { font-size: 0.8rem; background: #141414; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; }

  .targets { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .target-slot { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 100px; text-align: center; cursor: pointer; }
  .target-slot .t-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .target-slot .t-card { min-height: 74px; display: flex; align-items: center; justify-content: center; }

  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .result-team { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .result-team h3 { margin: 0 0 8px; font-size: 1rem; }
  .result-team .row { padding: 4px 0; font-size: 0.88rem; }
  .result-team .total { font-size: 1.4rem; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <a href="menu.html" class="back-link">&larr; Menü</a>
      <h1 id="title">Tichu</h1>
      <p class="sub" id="subtitle" style="margin:0">Lade…</p>
    </div>
  </div>
  <div id="error"></div>
  <div id="app"></div>
</div>

<script type="module">
import { ensureSignedIn, getProfile } from './lib/auth.js';
import {
  getAllHands, dealFreshRound, postEvent, watchEvents, watchGame, SEAT_LABELS,
  getWinCondition, describeWinCondition,
} from './lib/lobby.js';
import { finishTournamentMatch } from './lib/tournament.js';
import { Round, teamOf } from './engine/game.js';
import { sortHand, cardPoints, createDeck } from './engine/cards.js';
import { classify, canBeat } from './engine/combos.js';
import { newSecret, commitHash, emptyDeal, applyDealEvent, dealComplete, dealFromReveals } from './engine/fairdeal.js';

// --- Auth/Setup ------------------------------------------------------------
const errorEl = document.getElementById('error');
function fatal(msg) {
  errorEl.innerHTML = `<div class="error-banner">${msg}</div>`;
}

const params = new URLSearchParams(location.search);
const gameId = params.get('g');
const mine = JSON.parse(localStorage.getItem('tichu.mySeat') || 'null');

if (!gameId || !mine || mine.gameId !== gameId) {
  window.location.href = 'menu.html';
  throw new Error('kein passender Sitz für diesen Tisch');
}
const mySeat = mine.seatIndex;

const user = await ensureSignedIn().catch((e) => { fatal(String(e)); return null; });
if (!user) throw new Error('nicht angemeldet');
const profile = await getProfile(user.uid);
if (!profile || !profile.displayName) { window.location.href = 'index.html'; throw new Error('kein Profil'); }

let gameMeta = null;
let started = false;
let lastKnownStatus = null;
let redirectingHome = false;
watchGame(gameId, (game) => {
  gameMeta = game;
  if (game) {
    document.getElementById('title').textContent = game.name ? `Tisch ${game.name}` : 'Tichu';
    document.getElementById('subtitle').textContent = describeWinCondition(game);
    // Springt der Tisch, NACHDEM er schon lief, wieder auf 'waiting' zurück, hat jemand ihn
    // zurückgesetzt (manuell verlassen oder wegen Inaktivität gekickt, früher durch den Zugtimer) -
    // alle Clients (auch der gekickte selbst, falls dessen Tab noch offen ist) müssen dann
    // zurück ins Menü, der eigene Sitz ist nicht mehr gültig.
    if (started && !redirectingHome && lastKnownStatus && lastKnownStatus !== 'waiting' && game.status === 'waiting') {
      redirectingHome = true;
      const lastKick = [...events].reverse().find((e) => e.type === 'kicked');
      const notice = lastKick
        ? `Der Tisch wurde zurückgesetzt: ${seatLabel(lastKick.seatIndex)} wurde wegen Inaktivität vom Tisch entfernt.`
        : 'Der Tisch wurde zurückgesetzt.';
      localStorage.removeItem('tichu.mySeat');
      window.location.href = game.mode === 'tournament' ? 'turnier.html' : `menu.html?notice=${encodeURIComponent(notice)}`;
      return;
    }
    lastKnownStatus = game.status;
  }
  // Erst starten, sobald der Tisch WIRKLICH ausgeteilt hat - vorher existieren die privaten
  // Sitz-Dokumente noch gar nicht alle, das Lesen würde an der Regel scheitern (sieht als
  // "Missing or insufficient permissions" aus, ist aber nur "noch nicht so weit").
  if (!started && game && game.status !== 'waiting') {
    started = true;
    start();
  } else if (!started) {
    document.getElementById('app').innerHTML = '<p class="muted">Warte, bis der Tisch ausgeteilt hat…</p>';
  }
});

// </icons>
function labelFor(card) {
  if (card.special) return SPECIAL_ICON[card.special].label;
  return RANK_LABEL[card.rank] || String(card.rank);
}
// Im Turnier-Modus (gameMeta.mode === 'tournament') werden Sitze NICHT mit echten Namen oder
// festen Positions-Labels (Nord/Ost/Süd/West) angezeigt, sondern nur relativ zur eigenen Person -
// sonst könnte man per Zuruf/Chat außerhalb der App abgleichen "ich bin Nord, bist du mein
// Mate?" und so während des Turniers Infos austauschen. In Free Play zeigen wir stattdessen den
// echten Namen (siehe joinTable()/getAllHands() in lobby.js) - dort geht es nicht um Fairness,
// sondern nur um die Übersicht, wer mitspielt.
function seatLabel(seatIndex) {
  if (gameMeta && gameMeta.mode === 'tournament') {
    if (seatIndex === mySeat) return 'Du';
    if (seatIndex === (mySeat + 2) % 4) return 'Partner';
    if (seatIndex === (mySeat + 1) % 4) return 'Gegner 1';
    return 'Gegner 2';
  }
  const name = initialDeal && initialDeal.displayNames && initialDeal.displayNames[seatIndex];
  return name || SEAT_LABELS[seatIndex];
}
function cardEl(card, { selected = false, assigned = false, small = false, dim = false, onClick = null } = {}) {
  const div = document.createElement('div');
  div.className = 'pcard' + (card.special ? ' special' : '') + (small ? ' small' : '') + (selected ? ' selected' : '') + (assigned ? ' assigned' : '') + (dim ? ' dim' : '') + (onClick ? ' clickable' : '');
  const label = labelFor(card);
  const icon = card.special ? SPECIAL_ICON[card.special] : SUIT_ICON[card.suit];
  const color = card.special ? AMBER : icon.color;
  const fill = card.special ? AMBER : icon.fill;
  const art = card.special && SPECIAL_SVG[card.special]
    ? `<svg class="icon" viewBox="0 0 64 64" width="${small ? 32 : 42}" height="${small ? 32 : 42}">${SPECIAL_SVG[card.special]}</svg>`
    : `<svg class="icon" viewBox="0 0 32 32" width="26" height="26"><path d="${icon.path}" fill="${fill}" stroke="${color}" stroke-width="0.6"/></svg>`;
  div.innerHTML = `
    <div class="corner tl" style="color:${color}">${label}</div>
    ${art}
    <div class="corner br" style="color:${color}">${label}</div>
  `;
  if (onClick) div.addEventListener('click', onClick);
  return div;
}
// Firestore erlaubt kein Array direkt in einem Array (nur Array in Map/Objekt). first8/rest6
// sind je vier Karten-Arrays - für den `newRound`-Event-Payload deshalb als Objekt mit
// Sitzindex-Schlüsseln statt als Array-of-Arrays kodiert.
function seatArrToMap(arr) {
  return { 0: arr[0], 1: arr[1], 2: arr[2], 3: arr[3] };
}
function seatMapToArr(map) {
  return [0, 1, 2, 3].map((i) => map[i]);
}

function comboLabel(combo) {
  if (!combo) return '';
  const names = {
    SINGLE: 'Einzel', PAIR: 'Paar', TRIPLE: 'Drilling', FULLHOUSE: 'Full House',
    STAIRS: 'Treppe', STRAIGHT: 'Straße', BOMB_QUAD: 'Vierling-Bombe', BOMB_STRAIGHTFLUSH: 'Straßenbombe', DOG: 'Hund',
  };
  return names[combo.type] || combo.type;
}

// --- Ereignis-Log -> Runde ---------------------------------------------------
// Jeder Teilnehmer baut lokal aus derselben, geordneten Ereignisliste dieselbe Runde nach
// (dieselbe Engine wie play.html). Kein serverseitiges Prüfen der Zug-Gültigkeit - ungültige/
// verspätete Ereignisse werden beim Nachspielen einfach übersprungen (siehe firestore.rules).
// `newRound`-Ereignisse tragen den kompletten frischen 8+6-Deal direkt im Payload (statt über
// die privaten Sitz-Dokumente) - passt zum "alles öffentlich im Ereignis-Log"-Modell und
// braucht keine weitere Firestore-Schreibkoordination. Werden nur verarbeitet, solange die
// aktuelle Runde schon vorbei ist (`round.over`) - ein verfrühtes/doppeltes `newRound` (z. B.
// zwei Leute klicken gleichzeitig "Nochmal spielen") wird sonst ignoriert.
// startScore: Punktestand, mit dem der Tisch beginnt (z. B. nach einem Reset durch die Admin, die den
// Stand vor dem Reset beibehält - siehe adminResetTable() in lib/tournament.js).
// `fair`: faires Austeilen (siehe engine/fairdeal.js): Hände und alle Folgerunden kommen aus den vier
// Beiträgen (`dealCommit`/`dealReveal`) statt von einem einzelnen Austeiler; private Sitz-Dokumente und
// `newRound`-Ereignisse werden dann ignoriert. Vor dem ersten Austeilen gibt es noch keine Runde (round = null).
function replay(first8, rest6, legacy, events, startScore, fair = false, gid = null) {
  let round = fair ? null : (legacy ? new Round({ hands: first8 }) : new Round({ first8, rest6 }));
  let matchScore = Array.isArray(startScore) ? [Number(startScore[0]) || 0, Number(startScore[1]) || 0] : [0, 0];
  let schupfenSubs = {};
  let roundsCompleted = 0; // für die "Best of N Runden"-Siegbedingung, siehe renderRoundOver()
  let slot = 0; // die wievielte Austeilung als Nächstes ansteht (0 = erste Runde)
  let deal = emptyDeal();
  let roundStartIdx = 0; // Index des Ereignisses, das die aktuelle Runde ausgeteilt hat (für "bereit"-Zählung)
  events.forEach((ev, idx) => {
    try {
      if (fair && (ev.type === 'dealCommit' || ev.type === 'dealReveal')) {
        if (round && !round.over) return; // nur zwischen den Runden
        if (applyDealEvent(deal, ev, gid, slot) && ev.type === 'dealReveal' && dealComplete(deal)) {
          if (round) {
            matchScore = [matchScore[0] + round.result.teamScore[0], matchScore[1] + round.result.teamScore[1]];
            roundsCompleted++;
          }
          round = new Round(dealFromReveals(gid, slot, deal));
          schupfenSubs = {};
          slot++;
          deal = emptyDeal();
          roundStartIdx = idx + 1;
        }
        return;
      }
      if (ev.type === 'newRound') {
        if (fair || !round.over) return;
        matchScore = [matchScore[0] + round.result.teamScore[0], matchScore[1] + round.result.teamScore[1]];
        roundsCompleted++;
        round = new Round({ first8: seatMapToArr(ev.payload.first8), rest6: seatMapToArr(ev.payload.rest6) });
        schupfenSubs = {};
        return;
      }
      if (!round) return; // fair: vor dem ersten Austeilen kann es keine Züge geben
      applyEvent(round, ev, schupfenSubs);
    } catch (e) {
      console.warn('Ereignis übersprungen:', ev, e.message);
    }
  });
  if (round && round.over) roundsCompleted++; // die gerade beendete (noch nicht abgelöste) Runde mitzählen
  return { round, matchScore, schupfenSubs, roundsCompleted, deal: { slot, commits: deal.commits, reveals: deal.reveals }, roundStartIdx };
}
function applyEvent(round, ev, schupfenSubs) {
  const { seatIndex, type, payload } = ev;
  if (type === 'grandTichu') {
    round.callGrandTichu(seatIndex, !!payload.called);
    if (!round.dealt14 && round.grandTichu.every((v) => v !== null)) round.dealRest();
  } else if (type === 'tichu') {
    round.callTichu(seatIndex);
  } else if (type === 'schupfenSubmit') {
    // Erst validieren, DANN in schupfenSubs eintragen - sonst würde ein veraltetes Ereignis
    // (z. B. aus einem wiederverwendeten Tisch, dessen events-Log nicht geleert wurde) die
    // Runde fälschlich als "schon geschupft" markieren, obwohl round.schupfen() weiter unten
    // wegen unauffindbarer Kartenreferenzen nie erfolgreich durchläuft (die Runde hängt dann
    // fest, siehe Kommentar bei renderSchupfen()).
    const others = [0, 1, 2, 3].filter((s) => s !== seatIndex);
    const gives = payload.gives || {};
    if (!others.every((s) => round.hands[seatIndex].some((c) => c.id === gives[s]))) {
      throw new Error('Schupfen-Zuordnung verweist auf nicht (mehr) vorhandene Karten');
    }
    schupfenSubs[seatIndex] = gives;
    if (!round.schupfenDone && [0, 1, 2, 3].every((i) => schupfenSubs[i])) {
      const matrix = [0, 1, 2, 3].map((i) => {
        const m = {};
        for (const [toStr, cardId] of Object.entries(schupfenSubs[i])) {
          const card = round.hands[i].find((c) => c.id === cardId);
          if (!card) throw new Error('Karte für Schupfen nicht gefunden');
          m[toStr] = card;
        }
        return m;
      });
      round.schupfen(matrix);
    }
  } else if (type === 'play') {
    const cards = payload.cardIds.map((id) => round.hands[seatIndex].find((c) => c.id === id));
    if (cards.some((c) => !c)) throw new Error('gespielte Karte nicht auf der Hand');
    round.play(seatIndex, cards, payload.wish != null ? { wish: payload.wish } : {});
  } else if (type === 'pass') {
    round.pass(seatIndex);
  } else if (type === 'giveDragonTrick') {
    round.giveDragonTrick(payload.toPlayerIdx);
  }
}

// --- Zustand -----------------------------------------------------------
let round = null;
let matchScore = [0, 0]; // Punkte aus bereits ABGESCHLOSSENEN Runden (die laufende zählt erst bei Rundenende dazu)
let roundsCompleted = 0; // inkl. der aktuellen, falls sie gerade zu Ende ist - für "Best of N"
let initialDeal = null;
let events = [];
let selected = new Set();
let schupfenDraft = {}; // {toSeat: cardId}
let schupfenPendingCardId = null; // gerade angetippte, noch nicht zugeordnete Karte
let errorMsg = '';
let playAgainClicked = false;
let wishScroll = false; // einmalig zum Wunsch-Block scrollen, wenn er erscheint
let wishChoice = null; // gewählter Rang, 'none' (kein Wunsch) oder null, solange noch nichts gewählt ist
let wishPick = null; // Mahjong-Auswahl: Kartennummern, die gespielt werden, sobald der Wunsch gewählt ist
let tournamentResultState = null; // null | 'saving' | 'saved' | 'failed' - Turnier: Ergebnis-Speicherung
let tournamentResultAttempted = false; // verhindert wiederholte finishTournamentMatch()-Versuche
// bei jedem Re-Render, sobald einmal (erfolgreich oder nicht) versucht wurde - ein doppelter
// Schreibversuch würde ohnehin nur an der "result bereits gesetzt"-Regel scheitern, siehe
// lib/tournament.js, soll aber nicht bei jedem Sekunden-Tick erneut angestoßen werden.
let currentSchupfenSubs = {};
let fairMode = false; // faires Austeilen aktiv (siehe replay())
let dealInfo = null; // { slot, commits, reveals } der anstehenden Austeilung
let roundStartIdx = 0;
let commitPostedFor = -1;
let revealPostedFor = -1;

// --- Zugtimer: nur Anzeige, KEIN automatischer Zug und kein Kick ----------------------------
// Jeder Client verfolgt lokal, wer gerade "dran" ist (Grand-Tichu-Entscheidung, Drachenstich-
// Vergabe oder ein normaler Spielzug: 1 Minute) bzw. wie lange das Schupfen schon läuft (alle
// vier gleichzeitig: 3 Minuten) und zeigt die Restzeit an. Läuft sie ab, passiert nichts - es
// wird nie automatisch für jemanden gespielt, der Tisch wartet einfach weiter.
const TURN_TIMEOUT_MS = 60 * 1000;
const SCHUPFEN_TIMEOUT_MS = 3 * 60 * 1000;
let turnTimerActor = null;      // Sitzindex, oder 'schupfen' solange alle gemeinsam schupfen
let turnTimerStartedAt = null;
let turnRemainingSec = null;
let turnTimerLimitMs = TURN_TIMEOUT_MS;

// Wer muss gerade handeln? null, solange niemand konkret am Zug ist (z. B. Rundenende-Screen).
function actingSeat() {
  if (!round) return null;
  if (!round.dealt14) {
    const idx = round.grandTichu.findIndex((v) => v === null);
    return idx === -1 ? null : idx;
  }
  if (round.over) return null;
  if (!round.schupfenDone) {
    const idx = [0, 1, 2, 3].find((i) => !currentSchupfenSubs[i]);
    return idx === undefined ? null : idx;
  }
  if (round.pendingDragonGiveaway) return round.pendingDragonGiveaway.winnerIdx;
  return round.turn;
}

// Merkt sich, seit wann der aktuelle Akteur dran ist (setzt den Timer zurück, sobald sich der
// Akteur ändert) - läuft für ALLE sichtbar mit, auch für die/den Betroffene(n) selbst, damit
// man die eigene Restzeit sieht. Der automatische Zug bei Ablauf (siehe unten im Interval)
// wird aber weiterhin NIE vom eigenen Client ausgelöst - man soll die eigene, gerade in Arbeit
// befindliche Entscheidung nicht selbst überschreiben; die drei anderen Clients setzen den
// Timeout notfalls für einen um.
function syncTurnTimer() {
  const schupfen = round && round.dealt14 && !round.over && !round.schupfenDone;
  const key = schupfen ? 'schupfen' : actingSeat();
  if (key === null) {
    turnTimerActor = null;
    turnTimerStartedAt = null;
    turnRemainingSec = null;
    return;
  }
  if (turnTimerActor !== key) {
    turnTimerActor = key;
    turnTimerStartedAt = Date.now();
    turnTimerLimitMs = schupfen ? SCHUPFEN_TIMEOUT_MS : TURN_TIMEOUT_MS;
  }
}

setInterval(() => {
  if (turnTimerActor === null || turnTimerStartedAt === null) return;
  const elapsed = Date.now() - turnTimerStartedAt;
  turnRemainingSec = Math.max(0, Math.ceil((turnTimerLimitMs - elapsed) / 1000));
  if (round) render();
}, 1000);

function withError(fn) {
  return async (...args) => {
    try {
      await fn(...args);
      errorMsg = '';
    } catch (e) {
      errorMsg = e.message || String(e);
    }
    render();
  };
}

async function start() {
  initialDeal = await getAllHands(gameId).catch((e) => { fatal('Konnte Hände nicht laden: ' + e.message); return null; });
  if (!initialDeal) return;
  // Faires Austeilen: Tische mit fairDeal-Markierung immer (private Hände/newRound anderer werden dann
  // ignoriert); sonst, wenn niemand Hände abgelegt hat (neuer Tisch). Alte, schon klassisch ausgeteilte
  // Spiele laufen unverändert weiter.
  fairMode = !!(gameMeta && gameMeta.fairDeal === true) || (!initialDeal.legacy && initialDeal.first8.every((h) => h.length === 0));
  watchEvents(gameId, (all, fromCache) => {
    // Das events-Log eines wiederverwendeten Tisches kann noch Ereignisse der VORHERIGEN Partie
    // enthalten (das Aufräumen beim Verlassen klappt nicht immer, siehe clearEvents() in lobby.js).
    // Die würden auf den neuen Deal angewendet: Große-Tichu-Phase übersprungen, fremdes Tichu schon
    // angesagt. Ereignisse, die vor dem aktuellen Deal angelegt wurden, gehören nie zu dieser Partie;
    // eigene, noch nicht vom Server bestätigte (createdAt noch leer) zählen als neu.
    const dealStart = initialDeal.dealStartMs || 0;
    const evs = dealStart
      ? all.filter((e) => !(e.createdAt && typeof e.createdAt.toMillis === 'function' && e.createdAt.toMillis() < dealStart))
      : all;
    events = evs;
    const result = replay(initialDeal.first8, initialDeal.rest6, initialDeal.legacy, events, gameMeta && gameMeta.startScore, fairMode, gameId);
    round = result.round;
    dealInfo = result.deal;
    roundStartIdx = result.roundStartIdx;
    matchScore = result.matchScore;
    currentSchupfenSubs = result.schupfenSubs;
    roundsCompleted = result.roundsCompleted;
    // Eine alte Fehlermeldung (z. B. aus einem eigenen fehlgeschlagenen Zug) verschwindet
    // sonst erst beim nächsten EIGENEN erfolgreichen Zug - Züge der anderen räumen sie nicht
    // weg. Neuer Spielstand = alter Fehler ist ohnehin nicht mehr aktuell.
    errorMsg = '';
    playAgainClicked = false;
    syncTurnTimer();
    if (wishPick && (round.turn !== mySeat || round.over)) { wishPick = null; wishChoice = null; }
    render();
    // Nur auf einem vom Server bestätigten Stand handeln: der lokale Speicher kann direkt nach dem
    // Laden noch hinter dem echten Log zurückliegen (dann würde evtl. eine Runde doppelt ausgeteilt).
    if (!fromCache) { maybeAutoDeal(); maybeFairDeal(); }
  });
}

// --- Renderer ------------------------------------------------------------
// Hausregel (pro Tisch abschaltbar, siehe createTable()): sobald das eigene Team nur noch 100
// Punkte vom Ziel entfernt ist, muss einer der beiden Mitspieler diese Runde ein Tichu ansagen
// - nur ein deutlicher Hinweis, keine harte Sperre (passt zum Vertrauensmodell des restlichen
// Spielbretts).
function renderTurnTimer() {
  if (turnTimerActor === null || turnRemainingSec === null) return null;
  const p = document.createElement('p');
  p.className = 'error-banner';
  p.style.background = '#1c2e3a';
  p.style.borderColor = '#2563eb';
  p.style.color = '#93c5fd';
  const mmss = `${Math.floor(turnRemainingSec / 60)}:${String(turnRemainingSec % 60).padStart(2, '0')}`;
  if (turnTimerActor === 'schupfen') {
    p.textContent = turnRemainingSec > 0 ? `Schupfen - noch ${mmss}.` : 'Schupfen - die Zeit ist abgelaufen.';
  } else {
    const who = turnTimerActor === mySeat ? 'Du bist' : `${seatLabel(turnTimerActor)} ist`;
    p.textContent = turnRemainingSec > 0 ? `${who} am Zug - noch ${mmss}.` : `${who} am Zug - die Zeit ist abgelaufen.`;
  }
  return p;
}

function renderTichuWarning() {
  if (!round || round.over) return null;
  if (!gameMeta || gameMeta.catchUpRule === false) return null;
  const wc = getWinCondition(gameMeta);
  if (wc.type !== 'points') return null; // Hausregel ("100 Punkte vom Ziel") ergibt bei "Best of N" keinen Sinn
  const myTeam = teamOf(mySeat);
  if (matchScore[myTeam] < wc.target - 100) return null;
  const alreadyCalled = [0, 1, 2, 3].some((i) => teamOf(i) === myTeam && (round.tichu[i] || round.grandTichu[i]));
  if (alreadyCalled) return null;
  const p = document.createElement('p');
  p.className = 'error-banner';
  p.style.background = '#3a2c14';
  p.style.borderColor = '#8a5a16';
  p.style.color = '#fdba74';
  p.textContent = `Euer Team steht bei ${matchScore[myTeam]} Punkten (Ziel ${wc.target}) - einer von euch beiden muss diese Runde ein Tichu ansagen!`;
  return p;
}

function render() {
  const errEl = document.getElementById('error');
  errEl.innerHTML = errorMsg ? `<div class="error-banner">${errorMsg}</div>` : '';
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!round) {
    if (fairMode) { app.appendChild(renderDealing()); return; }
    app.innerHTML = '<p class="muted">Lade Spielstand…</p>';
    return;
  }
  const timerBanner = renderTurnTimer();
  if (timerBanner) app.appendChild(timerBanner);
  const warn = renderTichuWarning();
  if (warn) app.appendChild(warn);
  if (!round.dealt14) app.appendChild(renderGrandTichu());
  else if (round.over) app.appendChild(renderRoundOver());
  else if (!round.schupfenDone) app.appendChild(renderSchupfen());
  else app.appendChild(renderPlaying());
  app.appendChild(renderSpectatorLink());
  app.appendChild(renderScoreBar());
}

// Durchgehend sichtbarer Spielstand (abgeschlossene Runden, am Rundenende inkl. der gerade
// beendeten) aus Sicht der eigenen Mannschaft.
function renderScoreBar() {
  const total = [matchScore[0], matchScore[1]];
  if (round && round.over && round.result) { total[0] += round.result.teamScore[0]; total[1] += round.result.teamScore[1]; }
  const mine = teamOf(mySeat);
  const bar = document.createElement('div');
  bar.className = 'scorebar';
  bar.innerHTML = `Spielstand: Ihr <b>${total[mine]}</b> : <b>${total[1 - mine]}</b> Gegner · ${esc(describeWinCondition(gameMeta))}`;
  return bar;
}
function esc(t) { return String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// Turnier: nach jeder Spielrunde den Spielstand zeigen und erst weitermachen, wenn alle vier
// "bereit" gedrückt haben. Wer als Letzter bereit drückt, teilt die nächste Runde aus; ein
// doppeltes newRound-Ereignis wäre harmlos (replay() ignoriert es, solange die Runde nicht zu Ende ist).
function readyInfo() {
  let start = 0;
  if (fairMode) start = roundStartIdx;
  else for (let i = events.length - 1; i >= 0; i--) if (events[i].type === 'newRound') { start = i + 1; break; }
  const set = new Set();
  let last = null;
  for (const e of events.slice(start)) if (e.type === 'ready') { set.add(e.seatIndex); last = e.seatIndex; }
  return { set, last };
}
function matchOverNow() {
  if (!round || !round.over || !round.result) return false;
  const wc = getWinCondition(gameMeta);
  const fs = [matchScore[0] + round.result.teamScore[0], matchScore[1] + round.result.teamScore[1]];
  return wc.type === 'rounds' ? roundsCompleted >= wc.count : (fs[0] >= wc.target || fs[1] >= wc.target);
}
let dealPosted = false;
async function dealNextRound() {
  const { first8, rest6 } = dealFreshRound();
  await postEvent(gameId, mySeat, 'newRound', { first8: seatArrToMap(first8), rest6: seatArrToMap(rest6) });
}
function maybeAutoDeal() {
  if (fairMode) return; // faires Austeilen: siehe maybeFairDeal()
  if (!round || !round.over) { dealPosted = false; return; }
  if (!(gameMeta && gameMeta.mode === 'tournament') || matchOverNow() || dealPosted) return;
  const rs = readyInfo();
  if (rs.set.size === 4 && rs.last === mySeat) {
    dealPosted = true;
    dealNextRound().catch((e) => { dealPosted = false; errorMsg = e.message || String(e); render(); });
  }
}

// --- Faires Austeilen (siehe engine/fairdeal.js) ------------------------------------------------
// Jeder Spieler legt erst nur den Hash seines geheimen Zufallswerts fest (dealCommit); sind alle vier da,
// deckt jeder seinen Wert auf (dealReveal). Aus allen vier Werten ergeben sich die Karten - niemand
// allein bestimmt sie. Der Zufallswert liegt bis zum Aufdecken im Browser (localStorage), damit er ein
// Neuladen überlebt.
const memSecrets = {};
const secretKey = (slot) => `tichu.dealSecret.${gameId}.${slot}`;
function loadSecret(slot) {
  try { const v = localStorage.getItem(secretKey(slot)); if (v) return v; } catch (e) { /* privater Modus */ }
  return memSecrets[slot] || null;
}
function createSecret(slot) {
  const existing = loadSecret(slot);
  if (existing) return existing;
  const v = newSecret();
  memSecrets[slot] = v;
  try {
    // alte Werte dieses Spiels aufräumen
    const prefix = `tichu.dealSecret.${gameId}.`;
    for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(prefix) && k !== secretKey(slot)) localStorage.removeItem(k); }
    localStorage.setItem(secretKey(slot), v);
  } catch (e) { /* bleibt im Arbeitsspeicher */ }
  return v;
}
async function sendCommit(slot) {
  const secret = createSecret(slot);
  await postEvent(gameId, mySeat, 'dealCommit', { slot, c: commitHash(gameId, slot, mySeat, secret) });
}
function maybeFairDeal() {
  if (!fairMode || !dealInfo) return;
  if (round && !round.over) return;
  const { slot, commits, reveals } = dealInfo;
  const nCommits = Object.keys(commits).length;
  const iCommitted = commits[mySeat] !== undefined;
  const isTournament = !!(gameMeta && gameMeta.mode === 'tournament');
  // 1) eigenen Beitrag festlegen: erste Runde sofort; danach im Turnier, sobald alle vier "bereit" sind,
  //    im Free Play, sobald irgendwer "Nochmal spielen" gedrückt hat (sein Beitrag ist der erste)
  let want;
  if (!round) want = true;
  else if (matchOverNow()) want = false;
  else if (isTournament) want = readyInfo().set.size === 4;
  else want = nCommits > 0;
  if (want && !iCommitted && commitPostedFor !== slot) {
    commitPostedFor = slot;
    sendCommit(slot).catch((e) => { commitPostedFor = -1; errorMsg = e.message || String(e); render(); });
  }
  // 2) aufdecken, sobald alle vier festgelegt haben
  if (nCommits === 4 && iCommitted && reveals[mySeat] === undefined && revealPostedFor !== slot) {
    const secret = loadSecret(slot);
    if (secret) {
      revealPostedFor = slot;
      postEvent(gameId, mySeat, 'dealReveal', { slot, s: secret })
        .then(() => { delete memSecrets[slot]; try { localStorage.removeItem(secretKey(slot)); } catch (e) { /* egal */ } }) // jetzt öffentlich: nie wiederverwenden
        .catch((e) => { revealPostedFor = -1; errorMsg = e.message || String(e); render(); });
    }
  }
}
// Hinweis, solange gemeinsam gemischt wird (wer fehlt noch?)
function dealingNote(always = false) {
  if (!fairMode || !dealInfo) return null;
  const { commits, reveals } = dealInfo;
  const nC = Object.keys(commits).length, nR = Object.keys(reveals).length;
  if (nC === 0 && !always) return null;
  const missing = (nC < 4 ? [0, 1, 2, 3].filter((i) => commits[i] === undefined) : [0, 1, 2, 3].filter((i) => reveals[i] === undefined));
  const p = document.createElement('p');
  p.className = 'error-banner';
  p.style.background = '#1c2e3a';
  p.style.borderColor = '#2563eb';
  p.style.color = '#93c5fd';
  p.textContent = `Karten werden fair gemischt - alle vier würfeln mit, niemand kann sie allein bestimmen. Festgelegt ${nC}/4, aufgedeckt ${nR}/4`
    + (nR < 4 && missing.length ? ` · warte auf ${missing.map((i) => (i === mySeat ? 'dich' : seatLabel(i))).join(', ')}` : '') + '.';
  return p;
}
function renderDealing() {
  const wrap = document.createElement('div');
  const h = document.createElement('h2');
  h.textContent = 'Karten werden ausgeteilt';
  wrap.appendChild(h);
  wrap.appendChild(dealingNote(true));
  return wrap;
}

// Link für Zuschauer (spectate.html): zeigt nur öffentliche Züge. Im Turnier funktioniert er
// für andere erst nach Spielende.
function renderSpectatorLink() {
  const wrap = document.createElement('p');
  wrap.style.margin = '24px 0 0';
  const btn = document.createElement('button');
  btn.className = 'secondary';
  btn.style.cssText = 'padding: 6px 12px; font-size: 0.85rem;';
  btn.textContent = 'Zuschauer-Link kopieren';
  btn.addEventListener('click', async () => {
    const url = new URL(`spectate.html?g=${gameId}`, location.href).href;
    try { await navigator.clipboard.writeText(url); btn.textContent = 'Link kopiert'; }
    catch { window.prompt('Zuschauer-Link:', url); }
  });
  wrap.appendChild(btn);
  return wrap;
}

function renderGrandTichu() {
  const wrap = document.createElement('div');
  const decidedCount = round.grandTichu.filter((v) => v !== null).length;

  const status = document.createElement('p');
  status.className = 'sub';
  status.textContent = `Großes Tichu: ${decidedCount}/4 Spieler entschieden.`;
  wrap.appendChild(status);

  const handLabel = document.createElement('div');
  handLabel.className = 'sub';
  handLabel.style.margin = '0 0 6px';
  handLabel.textContent = 'Deine ersten 8 Karten:';
  wrap.appendChild(handLabel);

  const row = document.createElement('div');
  row.className = 'cards-row';
  for (const c of sortHand(round.first8[mySeat])) row.appendChild(cardEl(c));
  wrap.appendChild(row);

  const noBtn = document.createElement('button');

  row2.appendChild(yesBtn);

function renderSchupfen() {
  const wrap = document.createElement('div');
  // Reihenfolge der Ziele: linker Gegner, Partner (immer in der Mitte), rechter Gegner.
  const others = [(mySeat + 1) % 4, (mySeat + 2) % 4, (mySeat + 3) % 4];

  const status = document.createElement('p');
  status.className = 'sub';
  // currentSchupfenSubs kommt aus replay() und wird dort bei jedem 'newRound' zurückgesetzt -
  // zählt also nur Einreichungen DIESER Runde. Ein direktes Zählen über das komplette
  // events-Log wäre falsch: Sitzindizes sind über Runden hinweg stabil, ab Runde 2 stünde man
  // sonst fälschlich sofort als "schon abgegeben", weil man das in Runde 1 schonmal war.
  const doneCount = [0, 1, 2, 3].filter((i) => currentSchupfenSubs[i]).length;
  status.textContent = `Schupfen: ${doneCount}/4 Spieler bereit.`;
  wrap.appendChild(status);

  const partnerSeat = (mySeat + 2) % 4;
  const partnerInfo = document.createElement('p');
  partnerInfo.style.margin = '0 0 8px';
  partnerInfo.innerHTML = `Dein Partner: <b>${seatLabel(partnerSeat)}</b>`;
  wrap.appendChild(partnerInfo);

  const alreadySubmitted = !!currentSchupfenSubs[mySeat];

  if (alreadySubmitted) {
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'Du hast deine Karten abgegeben - warte auf die anderen…';
    wrap.appendChild(p);
    return wrap;
  }

  const hint = document.createElement('p');
  hint.className = 'sub';
  hint.style.margin = '0 0 10px';
  hint.textContent = 'Karte antippen, dann Ziel antippen. Nochmal auf ein belegtes Ziel tippen entfernt die Zuordnung.';
  wrap.appendChild(hint);

  const targets = document.createElement('div');
  targets.className = 'targets';
  others.forEach((targetSeat) => {
    const slot = document.createElement('div');
    slot.className = 'target-slot';
    slot.innerHTML = `<div class="t-label">an ${seatLabel(targetSeat)}${targetSeat === (mySeat + 2) % 4 && seatLabel(targetSeat) !== 'Partner' ? ' (Partner)' : ''}</div>`;
    const cardHolder = document.createElement('div');
    cardHolder.className = 't-card';
    const assignedId = schupfenDraft[targetSeat];
    const assignedCard = assignedId != null ? round.hands[mySeat].find((c) => c.id === assignedId) : null;
    if (assignedCard) cardHolder.appendChild(cardEl(assignedCard, { assigned: true }));
    else cardHolder.innerHTML = '<span class="muted" style="font-size:0.75rem">leer</span>';
    slot.appendChild(cardHolder);
    slot.addEventListener('click', () => {
      if (schupfenPendingCardId != null) {
        for (const k of Object.keys(schupfenDraft)) if (schupfenDraft[k] === schupfenPendingCardId) delete schupfenDraft[k];
        schupfenDraft[targetSeat] = schupfenPendingCardId;
        schupfenPendingCardId = null;
      } else if (schupfenDraft[targetSeat] != null) {
        delete schupfenDraft[targetSeat];
      }
      render();
    });
    targets.appendChild(slot);
  });
  wrap.appendChild(targets);

  const handLabel = document.createElement('div');
  handLabel.className = 'sub';
  handLabel.style.margin = '0 0 6px';
  handLabel.textContent = 'Deine Hand:';
  wrap.appendChild(handLabel);

  const assignedIds = new Set(Object.values(schupfenDraft));
  const row = document.createElement('div');
  row.className = 'cards-row';
  for (const c of sortHand(round.hands[mySeat])) {
    row.appendChild(cardEl(c, {
      selected: schupfenPendingCardId === c.id,
      assigned: assignedIds.has(c.id),
      onClick: () => {
        if (assignedIds.has(c.id)) return;
        schupfenPendingCardId = schupfenPendingCardId === c.id ? null : c.id;
        render();
      },
    }));
  }
  wrap.appendChild(row);

  const allReady = others.every((s) => schupfenDraft[s] != null);
  const submit = document.createElement('button');
  submit.style.marginTop = '16px';
  submit.textContent = 'Schupfen abgeben';
  submit.disabled = !allReady;
  submit.addEventListener('click', withError(async () => {
    await postEvent(gameId, mySeat, 'schupfenSubmit', { gives: schupfenDraft });
  }));
  wrap.appendChild(submit);
  return wrap;
}

// Kartennummern sind in jedem Spiel dieselben (siehe createDeck()), daher lässt sich aus den
// Schupfen-Ereignissen jederzeit ablesen, wer was gegeben hat.
const DECK_BY_ID = Object.fromEntries(createDeck().map((c) => [c.id, c]));
function cardText(id) {
  const c = DECK_BY_ID[id];
  if (!c) return '?';
  return c.special ? SPECIAL_ICON[c.special].label : `${labelFor(c)} ${c.suit}`;
}
let schupfenHistoryOpen = false;

// "Geschupft": was man selbst weitergegeben und von wem man was bekommen hat - diese Runde
// als Karten (linker Gegner | Partner | rechter Gegner), frühere Runden als Liste.
function renderSchupfenSummary() {
  if (!round || !round.schupfenDone || !currentSchupfenSubs[mySeat]) return null;
  const order = [(mySeat + 1) % 4, (mySeat + 2) % 4, (mySeat + 3) % 4];
  const box = document.createElement('div');
  box.className = 'panel';
  box.style.marginTop = '14px';
  const cols = order.map((t) => {
    const gaveId = currentSchupfenSubs[mySeat] && currentSchupfenSubs[mySeat][t];
    const gotId = currentSchupfenSubs[t] && currentSchupfenSubs[t][mySeat];
    return `<div style="flex:1;min-width:90px;text-align:center"><div class="sub" style="margin:0 0 6px"><b>${esc(seatLabel(t))}</b></div>
      <div class="sub" style="margin:0">Gegeben</div><div class="sch-card" data-id="${gaveId}"></div>
      <div class="sub" style="margin:6px 0 0">Bekommen</div><div class="sch-card" data-id="${gotId}"></div></div>`;
  }).join('');
  box.innerHTML = `<div class="sub" style="margin:0 0 8px"><b>Geschupft in dieser Runde</b></div><div style="display:flex;gap:10px">${cols}</div>`;
  box.querySelectorAll('.sch-card').forEach((el) => {
    const c = DECK_BY_ID[el.dataset.id];
    if (c) { el.style.display = 'flex'; el.style.justifyContent = 'center'; el.appendChild(cardEl(c, { small: true })); } else el.textContent = '–';
  });
  // frühere Runden dieses Matches
  const past = [];
  let subs = {};
  for (const ev of events) {
    if (ev.type === 'newRound') { if (Object.keys(subs).length === 4) past.push(subs); subs = {}; }
    else if (ev.type === 'schupfenSubmit' && ev.payload && ev.payload.gives) subs[ev.seatIndex] = ev.payload.gives;
  }
  if (past.length) {
    const d = document.createElement('details');
    d.open = schupfenHistoryOpen;
    d.style.marginTop = '10px';
    d.addEventListener('toggle', () => { schupfenHistoryOpen = d.open; });
    const lines = past.map((ps, i) => `<div class="sub" style="margin:4px 0"><b>Runde ${i + 1}:</b> ${order.map((t) => `${esc(seatLabel(t))}: gegeben ${esc(cardText(ps[mySeat] && ps[mySeat][t]))}, bekommen ${esc(cardText(ps[t] && ps[t][mySeat]))}`).join(' · ')}</div>`).reverse().join('');
    d.innerHTML = `<summary class="sub" style="cursor:pointer">Frühere Runden (${past.length})</summary>${lines}`;
    box.appendChild(d);
  }
  return box;
}

// Muss ich den Wunsch erfüllen? Dann: welche Karten sind überhaupt spielbar (Rest wird ausgegraut).
let forcedCache = { key: '', val: null };
function forcedWishCards() {
  if (round.pendingWish == null || round.turn !== mySeat || round.pendingDragonGiveaway) return null;
  const key = [round.pendingWish, round.hands[mySeat].map((c) => c.id).join('.'), (round.currentTrick.cardsInTrick || []).map((c) => c.id).join('.')].join('|');
  if (forcedCache.key !== key) forcedCache = { key, val: round.wishAllowedCardIds(mySeat) };
  return forcedCache.val;
}

function renderPlaying() {
  const wrap = document.createElement('div');

  if (round.pendingDragonGiveaway) {
    const overlay = document.createElement('div');
    overlay.className = 'panel';
    overlay.style.borderColor = '#d97706';
    const winner = round.pendingDragonGiveaway.winnerIdx;
    if (winner === mySeat) {
      const opponents = [0, 1, 2, 3].filter((s) => teamOf(s) !== teamOf(winner));
      overlay.innerHTML = `<p><b>Du hast den Drachen gewonnen.</b> An welchen Gegner geht der Stich?</p>`;
      const row = document.createElement('div');
      row.className = 'row';
      for (const s of opponents) {
        const btn = document.createElement('button');
        btn.textContent = seatLabel(s);
        btn.addEventListener('click', withError(async () => {
          await postEvent(gameId, mySeat, 'giveDragonTrick', { toPlayerIdx: s });
        }));
        row.appendChild(btn);
      }
      overlay.appendChild(row);
    } else {
      overlay.innerHTML = `<p>${seatLabel(winner)} hat den Drachen gewonnen und vergibt den Stich…</p>`;
    }
    wrap.appendChild(overlay);
  }

  const seats = document.createElement('div');
  seats.className = 'seats';
  for (let i = 0; i < 4; i++) {
    const panel = document.createElement('div');
    panel.className = 'seat-panel' + (i === round.turn ? ' active' : '') + (i === mySeat ? ' me' : '');
    const place = round.finishOrder.indexOf(i);
    panel.innerHTML = `
      <div class="head">
        <span class="name">${seatLabel(i)}${i === mySeat && !(gameMeta && gameMeta.mode === 'tournament') ? ' (du)' : ''}${i === round.turn ? ' 🎯' : ''}</span>
        <span class="meta">${round.hands[i].length} Karten</span>
      </div>
      <div>
        ${round.grandTichu[i] ? '<span class="flair gt">Großes Tichu</span>' : (round.tichu[i] ? '<span class="flair t">Tichu</span>' : '')}
        ${place >= 0 ? `<span class="flair place">Platz ${place + 1}</span>` : ''}
      </div>
    `;
    if (i === mySeat && round.playedAny && !round.playedAny[i] && !round.tichu[i] && !round.grandTichu[i] && round.active.has(i)) {
      const tbtn = document.createElement('button');
      tbtn.className = 'seat-tichu-btn';
      tbtn.textContent = 'Tichu ansagen';
      tbtn.addEventListener('click', withError(async () => { await postEvent(gameId, mySeat, 'tichu', {}); }));
      panel.appendChild(tbtn);
    }
    seats.appendChild(panel);
  }
  wrap.appendChild(seats);

  const table = document.createElement('div');
  table.className = 'table-area';
  const label = document.createElement('div');
  label.className = 'trick-label';
  if (wishPick) {
    label.textContent = 'Du legst den Mahjong - wähle deinen Wunsch und bestätige (die anderen sehen ihn erst danach)';
  } else if (round.currentTrick.combo === null) {
    label.textContent = `${seatLabel(round.turn)} eröffnet den Stich`;
  } else {
    label.textContent = `Zuletzt: ${seatLabel(round.currentTrick.winnerIdx)} spielt ${comboLabel(round.currentTrick.combo)}`;
  }
  table.appendChild(label);
  const trickCards = document.createElement('div');
  trickCards.className = 'trick-cards';
  // Während der Wunschwahl liegt der Mahjong nur bei dir auf dem Tisch (Vorschau), noch nicht gesendet.
  const shownCards = wishPick ? round.hands[mySeat].filter((c) => wishPick.includes(c.id)) : round.currentTrick.cardsInTrick;
  for (const c of shownCards) trickCards.appendChild(cardEl(c, { small: true }));
  table.appendChild(trickCards);
  wrap.appendChild(table);

  const handZone = document.createElement('div');
  handZone.className = 'hand-zone';
  const handLabel = document.createElement('div');
  handLabel.className = 'label';
  handLabel.textContent = round.turn === mySeat ? 'Deine Hand (du bist am Zug):' : 'Deine Hand:';
  handZone.appendChild(handLabel);
  const row = document.createElement('div');
  row.className = 'cards-row';
  // Karten bleiben IMMER auswählbar, auch außer der Reihe - eine Bombe darf jederzeit geworfen
  // werden (siehe engine/game.js: Round.play() erlaubt das explizit). Ob eine Auswahl tatsächlich
  // spielbar ist, entscheidet der "Karten spielen"-Button unten.
  const canSelect = !round.pendingDragonGiveaway;
  // Muss der Wunsch erfüllt werden, sind nur die dafür möglichen Karten wählbar, der Rest ist grau.
  const forcedAllowed = forcedWishCards();
  if (forcedAllowed) for (const id of [...selected]) if (!forcedAllowed.has(id)) selected.delete(id);
  for (const c of sortHand(round.hands[mySeat])) {
    if (wishPick && wishPick.includes(c.id)) continue; // liegt als Vorschau auf dem Tisch
    const dim = !!forcedAllowed && !forcedAllowed.has(c.id);
    row.appendChild(cardEl(c, {
      selected: selected.has(c.id),
      dim,
      onClick: canSelect && !dim ? () => { selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id); render(); } : null,
    }));
  }
  handZone.appendChild(row);
  wrap.appendChild(handZone);

  if (wishPick) {
    const names = { 11: 'B', 12: 'D', 13: 'K', 14: 'A' };
    const label = (rank) => names[rank] || String(rank);
    const box = document.createElement('div');
    box.className = 'panel';
    box.style.cssText = 'margin:10px 0;border-color:var(--accent)';
    box.dataset.wishbox = '1';
    box.innerHTML = '<div class="sub" style="margin:0 0 8px"><b>Mahjong: Welchen Wunsch sagst du an?</b> Wer kann, muss diesen Rang spielen. Erst nach deiner Bestätigung sehen die anderen den Mahjong.</div>';
    const wishRow = document.createElement('div');
    wishRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';
    const chooser = (value) => () => { wishChoice = value; render(); };
    for (let rank = 2; rank <= 14; rank++) {
      const b = document.createElement('button');
      b.dataset.wish = rank;
      b.style.minWidth = '44px';
      if (wishChoice !== rank) b.className = 'secondary';
      b.textContent = label(rank);
      b.addEventListener('click', chooser(rank));
      wishRow.appendChild(b);
    }
    const none = document.createElement('button');
    none.dataset.wish = 'none';
    if (wishChoice !== 'none') none.className = 'secondary';
    none.textContent = 'Kein Wunsch';
    none.addEventListener('click', chooser('none'));
    wishRow.appendChild(none);
    box.appendChild(wishRow);
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center';
    const confirm = document.createElement('button');
    confirm.dataset.confirmWish = '1';
    confirm.disabled = wishChoice == null;
    confirm.textContent = wishChoice == null ? 'Bestätigen' : (wishChoice === 'none' ? 'Bestätigen: kein Wunsch' : `Bestätigen: Wunsch ${label(wishChoice)}`);
    confirm.addEventListener('click', withError(async () => {
      const ids = wishPick, choice = wishChoice;
      wishPick = null; wishChoice = null;
      const payload = { cardIds: ids };
      if (choice !== 'none') payload.wish = choice; // Firestore lehnt explizite undefined-Feldwerte ab
      selected = new Set();
      await postEvent(gameId, mySeat, 'play', payload);
    }));
    actions.appendChild(confirm);
    const cancel = document.createElement('button');
    cancel.className = 'secondary';
    cancel.textContent = 'Abbrechen';
    cancel.addEventListener('click', () => { wishPick = null; wishChoice = null; render(); });
    actions.appendChild(cancel);
    box.appendChild(actions);
    wrap.appendChild(box);
    // Danach rendert withError() noch einmal neu - deshalb das Element erst dann suchen
    if (wishScroll) { wishScroll = false; setTimeout(() => { const el = document.querySelector('[data-wishbox]'); if (el) el.scrollIntoView({ block: 'center' }); }, 50); }
  }

  const bar = document.createElement('div');
  bar.className = 'actionbar';
  if (round.pendingWish != null) {
    const chip = document.createElement('span');
    chip.className = 'wish-chip';
    const forced = !!forcedAllowed;
    chip.textContent = forced ? `Wunsch: ${round.pendingWish} - du musst ihn spielen!` : `Wunsch: ${round.pendingWish}`;
    if (forced) chip.style.cssText = 'border-color:var(--accent);color:#ffb27a;font-weight:700';
    bar.appendChild(chip);
  }

  const myTurn = round.turn === mySeat && !round.pendingDragonGiveaway;
  const selectedCombo = selected.size > 0 ? classify(sortHand(round.hands[mySeat].filter((c) => selected.has(c.id)))) : null;
  const isBombSelected = !!selectedCombo && (selectedCombo.type === 'BOMB_QUAD' || selectedCombo.type === 'BOMB_STRAIGHTFLUSH');
  if (isBombSelected && !myTurn) {
    const chip = document.createElement('span');
    chip.className = 'wish-chip';
    chip.textContent = 'Bombe! Darf jederzeit geworfen werden.';
    bar.appendChild(chip);
  }
  const spacer = document.createElement('div');
  spacer.className = 'spacer';
  bar.appendChild(spacer);

  const passBtn = document.createElement('button');
  passBtn.className = 'secondary';
  passBtn.textContent = 'Passen';
  passBtn.disabled = !!wishPick || !myTurn || round.currentTrick.combo === null;
  passBtn.addEventListener('click', withError(async () => {
    round.validatePass(mySeat); // z. B. "Wunsch muss erfüllt werden" sichtbar melden statt still zu ignorieren
    await postEvent(gameId, mySeat, 'pass', {});
  }));
  bar.appendChild(passBtn);

  const playBtn = document.createElement('button');
  playBtn.textContent = 'Karten spielen';
  playBtn.disabled = !!wishPick || round.pendingDragonGiveaway || selected.size === 0 || (!myTurn && !isBombSelected);
  playBtn.addEventListener('click', withError(async () => {
    const cards = sortHand(round.hands[mySeat].filter((c) => selected.has(c.id)));
    // Wer den Mahjong einzeln ausspielt, sagt einen Wunsch an (in einer Straße wird nicht gefragt) -
    // die Auswahl erscheint direkt auf der Seite (kein Browser-Fenster, das blockiert werden kann).
    round.validatePlay(mySeat, cards); // wirft bei Regelverstoß; withError() zeigt die Meldung an
    const playsMahjong = cards.length === 1 && cards[0].special === 'MAHJONG' && round.currentTrick.combo === null && round.turn === mySeat;
    if (playsMahjong && classify(cards)) { wishPick = cards.map((c) => c.id); wishChoice = null; wishScroll = true; render(); return; }
    await postEvent(gameId, mySeat, 'play', { cardIds: cards.map((c) => c.id) });
    selected = new Set();
  }));
  bar.appendChild(playBtn);
  wrap.appendChild(bar);

  const schupfenSummary = renderSchupfenSummary();
  if (schupfenSummary) wrap.appendChild(schupfenSummary);

  return wrap;
}

function renderRoundOver() {
  const wrap = document.createElement('div');
  const r = round.result;
  const heading = document.createElement('h2');
  heading.textContent = r.doubleWin ? 'Doppelsieg!' : 'Rundenende';
  wrap.appendChild(heading);

  let lastPlaceSeat = null;
  let lastPlaceHandPoints = 0;
  if (!r.doubleWin) {
    lastPlaceSeat = [...round.active][0];
    lastPlaceHandPoints = round.hands[lastPlaceSeat].reduce((sum, c) => sum + cardPoints(c), 0);
  }

  const grid = document.createElement('div');
  grid.className = 'result-grid';
  // Im Turnier keine festen Positionen (Süd/Nord/...) verraten, nur "Euer Team"/"Gegner".
  const tournamentView = !!(gameMeta && gameMeta.mode === 'tournament');
  const teamNames = tournamentView
    ? (teamOf(mySeat) === 0 ? ['Euer Team', 'Gegner'] : ['Gegner', 'Euer Team'])
    : ['Süd - Nord', 'West - Ost'];
  const teamTitle = (t) => (tournamentView ? teamNames[t] : `Team ${teamNames[t]}`);
  const teamSeats = [[2, 0], [3, 1]];
  for (let t = 0; t < 2; t++) {
    const box = document.createElement('div');
    box.className = 'result-team';
    let rows = '';
    for (const s of teamSeats[t]) {
      rows += `<div class="row">${seatLabel(s)}${s === mySeat && !(gameMeta && gameMeta.mode === 'tournament') ? ' (du)' : ''}: ${r.pointsPerPlayer[s]} Punkte${r.tichuBonus[s] ? ` (${r.tichuBonus[s] > 0 ? '+' : ''}${r.tichuBonus[s]} Tichu)` : ''}</div>`;
    }
    if (lastPlaceSeat != null && !teamSeats[t].includes(lastPlaceSeat) && lastPlaceHandPoints !== 0) {
      rows += `<div class="row">Restkarten von ${seatLabel(lastPlaceSeat)}: ${lastPlaceHandPoints} Punkte</div>`;
    }
    box.innerHTML = `<h3>${teamTitle(t)}</h3>${rows}<div class="total">${r.teamScore[t]} Punkte</div>`;
    grid.appendChild(box);
  }
  wrap.appendChild(grid);

  const finalScore = [matchScore[0] + r.teamScore[0], matchScore[1] + r.teamScore[1]];
  const wc = getWinCondition(gameMeta);
  const matchP = document.createElement('p');
  matchP.innerHTML = `Gesamtstand: <b>${finalScore[0]}</b> (${teamNames[0]}) : <b>${finalScore[1]}</b> (${teamNames[1]}) · ${describeWinCondition(gameMeta)}`
    + (wc.type === 'rounds' ? ` (Runde ${roundsCompleted}/${wc.count})` : '');
  wrap.appendChild(matchP);

  const matchOver = wc.type === 'rounds' ? roundsCompleted >= wc.count : (finalScore[0] >= wc.target || finalScore[1] >= wc.target);
  if (matchOver && gameMeta && gameMeta.mode === 'tournament' && gameMeta.result == null && !tournamentResultAttempted) {
    tournamentResultAttempted = true;
    tournamentResultState = 'saving';
    finishTournamentMatch(gameId, finalScore[0], finalScore[1])
      .then(() => { tournamentResultState = 'saved'; render(); })
      .catch((e) => { console.warn('Turnier-Ergebnis konnte nicht gespeichert werden:', e); tournamentResultState = 'failed'; render(); });
  }
  const isTournament = !!(gameMeta && gameMeta.mode === 'tournament');
  if (matchOver) {
    const winner = finalScore[0] === finalScore[1] ? null : (finalScore[0] > finalScore[1] ? 0 : 1);
    const p = document.createElement('p');
    p.innerHTML = `<b>Match beendet</b> - ${winner == null ? 'Unentschieden' : (tournamentView ? teamNames[winner] : 'Team ' + teamNames[winner]) + ' gewinnt!'}`;
    wrap.appendChild(p);
    if (isTournament) {
      // Der Tisch ist damit geschlossen (status: finished, Ergebnis gespeichert) - wer weiter ist,
      // sieht den Finaltisch unter "Mein Tisch", sobald alle Vorrunden-Tische entschieden sind.
      const saved = gameMeta.result != null || tournamentResultState === 'saved';
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = saved ? 'Ergebnis gespeichert, der Tisch ist geschlossen. Alles Weitere siehst du im Turnier.'
        : tournamentResultState === 'failed' ? 'Das Ergebnis konnte nicht automatisch gespeichert werden - die Turnierleitung trägt es ein.'
        : 'Ergebnis wird gespeichert…';
      wrap.appendChild(note);
    }
    const btn = document.createElement('button');
    btn.textContent = isTournament ? 'Weiter zum Turnier' : 'Zurück zum Menü';
    btn.addEventListener('click', () => {
      if (isTournament) localStorage.removeItem('tichu.mySeat');
      window.location.href = isTournament ? 'turnier.html' : 'menu.html';
    });
    wrap.appendChild(btn);
  } else if (isTournament) {
    const rs = readyInfo();
    const iAmReady = rs.set.has(mySeat);
    const info = document.createElement('p');
    info.innerHTML = `<b>Nächste Runde:</b> ${rs.set.size}/4 bereit${rs.set.size ? ' (' + [...rs.set].map((x) => esc(seatLabel(x))).join(', ') + ')' : ''}`;
    wrap.appendChild(info);
    const ready = document.createElement('button');
    ready.textContent = iAmReady ? 'Warte auf die anderen…' : 'Bereit für nächste Runde';
    ready.disabled = iAmReady;
    ready.addEventListener('click', withError(async () => { await postEvent(gameId, mySeat, 'ready', {}); }));
    wrap.appendChild(ready);
    if (rs.set.size === 4 && !(fairMode && dealInfo && dealInfo.commits[mySeat] !== undefined)) {
      const go = document.createElement('button');
      go.className = 'secondary';
      go.style.marginLeft = '8px';
      go.textContent = 'Jetzt austeilen';
      // fair: eigenen Beitrag (nochmal) senden - normalerweise passiert das automatisch
      go.addEventListener('click', withError(async () => { if (fairMode) await sendCommit(dealInfo.slot); else await dealNextRound(); }));
      wrap.appendChild(go);
    }
    const note = dealingNote();
    if (note) wrap.appendChild(note);
  } else {
    const again = document.createElement('button');
    const startedAlready = fairMode ? !!(dealInfo && dealInfo.commits[mySeat] !== undefined) : playAgainClicked;
    again.textContent = startedAlready ? 'Nächste Runde startet…' : 'Nochmal spielen';
    again.disabled = startedAlready;
    again.addEventListener('click', withError(async () => {
      if (fairMode) {
        // faires Austeilen: mein Beitrag ist der erste, die anderen steigen automatisch ein
        commitPostedFor = dealInfo.slot;
        await sendCommit(dealInfo.slot);
        return;
      }
      playAgainClicked = true;
      render();
      const { first8, rest6 } = dealFreshRound();
      await postEvent(gameId, mySeat, 'newRound', { first8: seatArrToMap(first8), rest6: seatArrToMap(rest6) });
    }));
    wrap.appendChild(again);
    const note = dealingNote();
    if (note) wrap.appendChild(note);

    const menuBtn = document.createElement('button');
    menuBtn.className = 'secondary';
    menuBtn.style.marginLeft = '8px';
    menuBtn.textContent = 'Zurück zum Menü';
    menuBtn.addEventListener('click', () => { window.location.href = 'menu.html'; });
    wrap.appendChild(menuBtn);
  }

  return wrap;
}
</script>
</body>
</html>
