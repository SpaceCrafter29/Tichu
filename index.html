<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tichu</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1>Tichu-Turnier</h1>
  <p class="sub">Melde dich an, um mitzuspielen.</p>

  <div class="panel" id="login-panel">
    <label for="username">Benutzername</label>
    <input type="text" id="username" maxlength="40" placeholder="z. B. Stefan" autocomplete="username" />
    <label for="password" style="margin-top: 12px; display: block;">Passwort</label>
    <input type="password" id="password" placeholder="Passwort" autocomplete="current-password" />
    <p class="muted" style="margin-top: 8px;">
      Neuer Benutzername? Beim ersten Login mit einem Passwort deiner Wahl wird der Account
      automatisch angelegt - merk dir das Passwort, es schützt danach deinen Namen.
    </p>
    <div class="row" style="margin-top: 12px;">
      <button id="login-btn">Anmelden</button>
    </div>
    <p class="error" id="login-error" hidden></p>
  </div>
</main>

<script type="module">
  import { login, getSignedInUser, getProfile } from './lib/auth.js';

  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');

  // Schon eingeloggt (Session übersteht Reload)? Dann direkt weiter zur Lobby.
  const existing = await getSignedInUser().catch(() => null);
  if (existing) {
    const profile = await getProfile(existing.uid).catch(() => null);
    if (profile && profile.displayName) {
      window.location.href = 'lobby.html';
    }
  }

  async function doLogin() {
    loginError.hidden = true;
    loginBtn.disabled = true;
    try {
      await login(usernameInput.value, passwordInput.value);
      window.location.href = 'lobby.html';
    } catch (e) {
      console.error(e);
      loginError.textContent = describeError(e);
      loginError.hidden = false;
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener('click', doLogin);
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  function describeError(e) {
    const code = e && e.code;
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
      return 'Falscher Benutzername oder falsches Passwort.';
    }
    if (code === 'auth/weak-password') {
      return 'Passwort ist zu kurz (mind. 6 Zeichen) - das gilt nur beim erstmaligen Anlegen.';
    }
    if (code === 'auth/configuration-not-found' || code === 'auth/admin-restricted-operation') {
      return 'Anmeldung per E-Mail/Passwort ist in der Firebase-Konsole noch nicht aktiviert.';
    }
    if (code === 'permission-denied') {
      return 'Firestore-Regeln blockieren diesen Zugriff.';
    }
    return e && e.message ? e.message : String(e);
  }
</script>
</body>
</html>
