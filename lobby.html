<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tichu - Lobby</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1>Lobby</h1>
  <p class="sub" id="greeting">…</p>

  <div class="panel" id="active-panel" hidden>
    <h3 style="margin-top:0" id="active-name">Dein Tisch</h3>
    <p class="muted" id="active-status"></p>
    <div class="seat-grid" id="active-seats"></div>
  </div>

  <div class="panel">
    <div class="row">
      <h3 style="margin:0">Offene Tische</h3>
      <button id="create-table" hidden>Neuen Tisch erstellen</button>
    </div>
    <div id="table-list" style="margin-top: 12px;">
      <p class="muted">Lade…</p>
    </div>
  </div>

  <div class="panel" id="admin-panel" hidden>
    <h3 style="margin-top:0">Orga: alle Tische</h3>
    <p class="muted">Sitz anklicken, um jemanden aus dem Tisch zu kicken (Platz wird wieder frei).</p>
    <div id="admin-list" style="margin-top: 12px;"></div>
  </div>

  <p class="error" id="error" hidden></p>
</main>

<script type="module">
  import { ensureSignedIn, getProfile, isOrganizer } from './lib/auth.js';
  import { watchOpenGames, watchAllGames, createTable, joinTable, kickSeat, watchGame, watchMySeat, SEAT_LABELS } from './lib/lobby.js';

  const errorEl = document.getElementById('error');
  function showError(e) {
    console.error(e);
    errorEl.textContent = e && e.message ? e.message : String(e);
    errorEl.hidden = false;
  }

  const user = await ensureSignedIn().catch((e) => { showError(e); return null; });
  if (!user) { window.location.href = 'index.html'; throw new Error('nicht angemeldet'); }

  const profile = await getProfile(user.uid);
  if (!profile || !profile.displayName) {
    window.location.href = 'index.html';
    throw new Error('kein Profil');
  }
  const amOrganizer = isOrganizer(user);
  document.getElementById('greeting').textContent =
    `Angemeldet als ${profile.displayName}${amOrganizer ? ' (Turnier-Orga)' : ''}.`;
  if (amOrganizer) {
    document.getElementById('create-table').hidden = false;
    document.getElementById('admin-panel').hidden = false;
  }

  // Session-Zustand: an welchem Tisch/Sitz nehme ich gerade teil (übersteht Reload).
  let mine = JSON.parse(localStorage.getItem('tichu.mySeat') || 'null');

  function rememberSeat(gameId, seatIndex) {
    mine = { gameId, seatIndex };
    localStorage.setItem('tichu.mySeat', JSON.stringify(mine));
  }

  const activePanel = document.getElementById('active-panel');
  const activeStatus = document.getElementById('active-status');
  const activeSeats = document.getElementById('active-seats');

  let latestGame = null;
  let latestSeat = null;

  function renderActiveGame() {
    if (!mine || !latestGame) {
      activePanel.hidden = true;
      return;
    }
    activePanel.hidden = false;
    document.getElementById('active-name').textContent = latestGame.name ? `Tisch ${latestGame.name}` : 'Dein Tisch';
    const labels = { waiting: 'Warte auf Mitspieler…', dealt: 'Karten ausgeteilt - Spielansicht folgt.', playing: 'Spiel läuft.', finished: 'Spiel beendet.' };
    let text = labels[latestGame.status] || latestGame.status;
    if (latestSeat && latestSeat.hand) text += ` Deine Hand: ${latestSeat.hand.length} Karten.`;
    activeStatus.textContent = text;
    activeSeats.innerHTML = '';
    latestGame.seats.forEach((token, i) => {
      const chip = document.createElement('div');
      chip.className = 'seat-chip' + (token ? ' filled' : '') + (i === mine.seatIndex ? ' me' : '');
      chip.textContent = SEAT_LABELS[i] + (token ? (i === mine.seatIndex ? ' (du)' : ' - belegt') : ' - frei');
      activeSeats.appendChild(chip);
    });
  }

  function attachToTable(gameId, seatIndex) {
    rememberSeat(gameId, seatIndex);
    watchGame(gameId, (game) => { latestGame = game; renderActiveGame(); });
    watchMySeat(gameId, seatIndex, (seat) => { latestSeat = seat; renderActiveGame(); });
  }

  if (mine) attachToTable(mine.gameId, mine.seatIndex);

  const tableListEl = document.getElementById('table-list');
  watchOpenGames((games) => {
    if (games.length === 0) {
      tableListEl.innerHTML = '<p class="muted">Aktuell keine offenen Tische.</p>';
      return;
    }
    tableListEl.innerHTML = '';
    for (const game of games) {
      const openSeats = game.seats.filter((s) => s === null).length;
      const row = document.createElement('div');
      row.className = 'table-row';
      const already = mine && mine.gameId === game.id;
      const tableName = game.name || `Tisch ${game.id.slice(0, 6)}`;
      row.innerHTML = `
        <span>${tableName} <span class="muted">(${4 - openSeats}/4, Ziel ${game.target})</span></span>
      `;
      const btn = document.createElement('button');
      btn.textContent = already ? 'Beigetreten' : 'Beitreten';
      btn.disabled = already;
      btn.className = 'secondary';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const { seatIndex } = await joinTable(game.id, user.uid);
          attachToTable(game.id, seatIndex);
        } catch (e) {
          showError(e);
          btn.disabled = false;
        }
      });
      row.appendChild(btn);
      tableListEl.appendChild(row);
    }
  });

  document.getElementById('create-table').addEventListener('click', async () => {
    try {
      const gameId = await createTable(1000);
      const { seatIndex } = await joinTable(gameId, user.uid);
      attachToTable(gameId, seatIndex);
    } catch (e) {
      showError(e);
    }
  });

  if (amOrganizer) {
    const adminListEl = document.getElementById('admin-list');
    watchAllGames((games) => {
      if (games.length === 0) {
        adminListEl.innerHTML = '<p class="muted">Keine Tische vorhanden.</p>';
        return;
      }
      adminListEl.innerHTML = '';
      for (const game of games) {
        const row = document.createElement('div');
        row.className = 'table-row';
        row.style.flexDirection = 'column';
        row.style.alignItems = 'stretch';
        const tableName = game.name || `Tisch ${game.id.slice(0, 6)}`;
        const title = document.createElement('div');
        title.innerHTML = `<strong>${tableName}</strong> <span class="muted">(${game.status})</span>`;
        row.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'seat-grid';
        grid.style.marginTop = '6px';
        game.seats.forEach((token, i) => {
          const chip = document.createElement('button');
          chip.className = 'secondary';
          chip.style.padding = '6px';
          chip.textContent = token ? `${SEAT_LABELS[i]}: kicken` : `${SEAT_LABELS[i]}: frei`;
          chip.disabled = !token;
          chip.addEventListener('click', async () => {
            chip.disabled = true;
            try {
              await kickSeat(game.id, i);
            } catch (e) {
              showError(e);
              chip.disabled = false;
            }
          });
          grid.appendChild(chip);
        });
        row.appendChild(grid);
        adminListEl.appendChild(row);
      }
    });
  }
</script>
</body>
</html>
