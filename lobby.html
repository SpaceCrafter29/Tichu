<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tichu - Lobby</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1 style="margin:0">Lobby</h1>
  <div class="row" style="align-items: baseline;">
    <p class="sub" id="greeting" style="margin:0">…</p>
    <button id="logout-btn" class="secondary" style="padding: 6px 12px; font-size: 0.85rem;">Abmelden</button>
  </div>

  <div class="panel" id="active-panel" hidden>
    <div class="row">
      <h3 style="margin:0" id="active-name">Dein Tisch</h3>
      <button id="leave-table" class="secondary" style="padding: 6px 12px; font-size: 0.85rem;">Tisch verlassen</button>
    </div>
    <p class="muted" id="active-status"></p>
    <div class="seat-grid" id="active-seats"></div>
  </div>

  <div class="row" style="margin-top: 8px;">
    <button id="tab-freeplay">Free Play</button>
    <button id="tab-tournament" class="secondary">Turnier</button>
  </div>

  <div class="panel">
    <div class="row">
      <h3 style="margin:0" id="table-list-title">Offene Tische</h3>
      <button id="create-table">Neuen Tisch erstellen</button>
    </div>
    <div id="table-list" style="margin-top: 12px;">
      <p class="muted">Lade…</p>
    </div>
  </div>

  <p class="error" id="error" hidden></p>
</main>

<script type="module">
  import { ensureSignedIn, getProfile, logout } from './lib/auth.js';
  import { watchOpenGames, createTable, joinTable, leaveTable, watchGame, watchMySeat, SEAT_LABELS } from './lib/lobby.js';

  const errorEl = document.getElementById('error');
  function showError(e) {
    console.error(e);
    errorEl.textContent = e && e.message ? e.message : String(e);
    errorEl.hidden = false;
  }

  const user = await ensureSignedIn().catch((e) => { showError(e); return null; });
  if (!user) { window.location.href = 'index.html'; throw new Error('nicht angemeldet'); }

  const profile = await getProfile(user.uid);
  if (!profile || !profile.displayName) {
    window.location.href = 'index.html';
    throw new Error('kein Profil');
  }
  document.getElementById('greeting').textContent = `Angemeldet als ${profile.displayName}.`;

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await logout();
    window.location.href = 'index.html';
  });

  // Session-Zustand: an welchem Tisch/Sitz nehme ich gerade teil (übersteht Reload). Immer nur
  // EIN Tisch gleichzeitig - solange `mine` gesetzt ist, sind Beitreten/Erstellen gesperrt
  // (siehe renderTableList/create-table unten), erst "Tisch verlassen" gibt das wieder frei.
  let mine = JSON.parse(localStorage.getItem('tichu.mySeat') || 'null');
  let unsubActiveGame = null;
  let unsubActiveSeat = null;

  function rememberSeat(gameId, seatIndex) {
    mine = { gameId, seatIndex };
    localStorage.setItem('tichu.mySeat', JSON.stringify(mine));
  }

  function forgetSeat() {
    mine = null;
    latestGame = null;
    latestSeat = null;
    localStorage.removeItem('tichu.mySeat');
    if (unsubActiveGame) { unsubActiveGame(); unsubActiveGame = null; }
    if (unsubActiveSeat) { unsubActiveSeat(); unsubActiveSeat = null; }
    renderActiveGame();
    renderTableList(lastGames);
  }

  const activePanel = document.getElementById('active-panel');
  const activeStatus = document.getElementById('active-status');
  const activeSeats = document.getElementById('active-seats');

  let latestGame = null;
  let latestSeat = null;

  function renderActiveGame() {
    if (!mine || !latestGame) {
      activePanel.hidden = true;
      return;
    }
    activePanel.hidden = false;
    document.getElementById('active-name').textContent = latestGame.name ? `Tisch ${latestGame.name}` : 'Dein Tisch';
    const labels = { waiting: 'Warte auf Mitspieler…', dealt: 'Karten ausgeteilt - Spielansicht folgt.', playing: 'Spiel läuft.', finished: 'Spiel beendet.' };
    let text = labels[latestGame.status] || latestGame.status;
    if (latestSeat && latestSeat.hand) text += ` Deine Hand: ${latestSeat.hand.length} Karten.`;
    activeStatus.textContent = text;
    activeSeats.innerHTML = '';
    latestGame.seats.forEach((token, i) => {
      const chip = document.createElement('div');
      chip.className = 'seat-chip' + (token ? ' filled' : '') + (i === mine.seatIndex ? ' me' : '');
      chip.textContent = SEAT_LABELS[i] + (token ? (i === mine.seatIndex ? ' (du)' : ' - belegt') : ' - frei');
      activeSeats.appendChild(chip);
    });
  }

  function attachToTable(gameId, seatIndex) {
    rememberSeat(gameId, seatIndex);
    unsubActiveGame = watchGame(gameId, (game) => { latestGame = game; renderActiveGame(); renderTableList(lastGames); });
    unsubActiveSeat = watchMySeat(gameId, seatIndex, (seat) => { latestSeat = seat; renderActiveGame(); });
  }

  if (mine) attachToTable(mine.gameId, mine.seatIndex);

  document.getElementById('leave-table').addEventListener('click', async () => {
    if (!mine) return;
    const { gameId, seatIndex } = mine;
    try {
      await leaveTable(gameId, seatIndex);
      forgetSeat();
    } catch (e) {
      showError(e);
    }
  });

  const tableListEl = document.getElementById('table-list');
  const tableListTitle = document.getElementById('table-list-title');
  const tabFreeplay = document.getElementById('tab-freeplay');
  const tabTournament = document.getElementById('tab-tournament');

  let mode = 'freeplay';
  let unsubOpenGames = null;
  let lastGames = [];
  const createTableBtn = document.getElementById('create-table');

  function renderTableList(games) {
    lastGames = games;
    createTableBtn.disabled = !!mine;
    createTableBtn.title = mine ? 'Erst den aktuellen Tisch verlassen, um einen neuen zu erstellen.' : '';
    if (games.length === 0) {
      tableListEl.innerHTML = '<p class="muted">Aktuell keine offenen Tische.</p>';
      return;
    }
    tableListEl.innerHTML = '';
    for (const game of games) {
      const openSeats = game.seats.filter((s) => s === null).length;
      const row = document.createElement('div');
      row.className = 'table-row';
      const already = mine && mine.gameId === game.id;
      const tableName = game.name || `Tisch ${game.id.slice(0, 6)}`;
      row.innerHTML = `
        <span>${tableName} <span class="muted">(${4 - openSeats}/4, Ziel ${game.target})</span></span>
      `;
      const btn = document.createElement('button');
      btn.textContent = already ? 'Beigetreten' : 'Beitreten';
      // Gesperrt, solange man schon an EINEM anderen Tisch sitzt - sonst könnte man
      // mehreren Tischen gleichzeitig beitreten (siehe leaveTable() für den Ausweg).
      btn.disabled = already || !!mine;
      btn.title = !already && mine ? 'Erst den aktuellen Tisch verlassen, um einem anderen beizutreten.' : '';
      btn.className = 'secondary';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const { seatIndex } = await joinTable(game.id, user.uid);
          attachToTable(game.id, seatIndex);
          renderTableList(lastGames);
        } catch (e) {
          showError(e);
          btn.disabled = false;
        }
      });
      row.appendChild(btn);
      tableListEl.appendChild(row);
    }
  }

  function setMode(newMode) {
    mode = newMode;
    tabFreeplay.className = mode === 'freeplay' ? '' : 'secondary';
    tabTournament.className = mode === 'tournament' ? '' : 'secondary';
    tableListTitle.textContent = mode === 'freeplay' ? 'Offene Tische - Free Play' : 'Offene Tische - Turnier';
    if (unsubOpenGames) unsubOpenGames();
    tableListEl.innerHTML = '<p class="muted">Lade…</p>';
    unsubOpenGames = watchOpenGames(mode, renderTableList);
  }

  tabFreeplay.addEventListener('click', () => setMode('freeplay'));
  tabTournament.addEventListener('click', () => setMode('tournament'));
  setMode('freeplay');

  createTableBtn.addEventListener('click', async () => {
    if (mine) return;
    try {
      const gameId = await createTable(mode, 1000);
      const { seatIndex } = await joinTable(gameId, user.uid);
      attachToTable(gameId, seatIndex);
      renderTableList(lastGames);
    } catch (e) {
      showError(e);
    }
  });
</script>
</body>
</html>
